<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- O bloco title permite que cada página tenha um título diferente na aba do navegador -->
    <title>{% block title %}Street Drop{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imagens/favicon.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- HEADER / NAVBAR (Comum a todas as páginas) -->
    <header class="bg-dark py-3 mb-4 border-bottom">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2">
            <a href="{{ url_for('index') }}" class="text-white text-decoration-none h3 mb-0 fw-bold">Street Drop</a>
            <nav class="nav">
                <a href="{{ url_for('index') }}" class="btn btn-outline-light me-2">Home</a>
                <a href="{{ url_for('sobre') }}" class="btn btn-outline-light me-2">Sobre nós</a>
            </nav>
            <form class="d-flex search-form" role="search">
                <input class="form-control me-2" type="search" placeholder="O que você procura?" aria-label="Pesquisar">
            </form>
        </div>
    </header>

    <!-- ÁREA DINÂMICA: Aqui entra o conteúdo específico de cada página -->
    {% block content %}
    {% endblock %}

    <!-- FOOTER (Comum a todas as páginas) -->
    <footer class="pt-4 pb-2 mt-auto bg-dark text-white">
        <div class="container">
            <div class="row align-items-center pb-3 border-bottom border-secondary">
                <div class="col-md-6 d-flex align-items-center gap-3 mb-3 mb-md-0">
                    <span class="fw-bold mb-0">Redes sociais:</span>
                    <img src="{{ url_for('static', filename='imagens/icons8-facebook-48.png') }}" width="32" alt="Facebook">
                    <img src="{{ url_for('static', filename='imagens/icons8-instagram-48.png') }}" width="32" alt="Instagram">
                    <img src="{{ url_for('static', filename='imagens/icons8-tiktok-48.png') }}" width="32" alt="TikTok">
                </div>
                <div class="col-md-6 d-flex align-items-center justify-content-md-end gap-2">
                    <label for="feedback" class="fw-bold me-2 mb-0">Deixe seu feedback:</label>
                    <input type="text" id="feedback" class="form-control form-control-sm w-auto" placeholder="Sua opinião...">
                </div>
            </div>
            <div class="text-center py-3 border-bottom border-secondary">
                <h3 class="fw-bold mb-0">Street Drop</h3>
            </div>
            <div class="row text-center pt-3 small">
                <div class="col-md-6 text-md-start mb-1 mb-md-0">2026 Site com cunho acadêmico</div>
                <div class="col-md-6 text-md-end">Estudante do 1 DSM (FATEC) - Denilson Brito Junior</div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
